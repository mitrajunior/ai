version: "3.9"

services:
  api:
    container_name: aiide-api
    build: ./api
    env_file: [.env]
    environment:
      - DATABASE_URL=postgresql+psycopg://$$POSTGRES_USER:$$POSTGRES_PASSWORD@db:5432/$$POSTGRES_DB
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=$$MINIO_BUCKET
      - S3_ACCESS_KEY=$$MINIO_ROOT_USER
      - S3_SECRET_KEY=$$MINIO_ROOT_PASSWORD
      - OLLAMA_URL=http://ollama:11434
      - ALLOWED_ORIGINS=$$ALLOWED_ORIGINS
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./scripts/seccomp-profile.json:/seccomp/profile.json:ro
    depends_on: [db, redis, minio, ollama]
    ports: ["${API_PORT:-8188}:8000"]

  web:
    container_name: aiide-web
    build: ./web
    env_file: [.env]
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:${API_PORT:-8188}
      - NEXT_PUBLIC_YJS_WS=ws://localhost:${YJS_PORT:-6060}
    depends_on: [api, yjs]
    ports: ["${WEB_PORT:-4300}:3000"]

  yjs:
    container_name: aiide-yjs
    build: ./yjs
    env_file: [.env]
    command: ["node","server.mjs"]
    ports: ["${YJS_PORT:-6060}:1234"]

  db:
    container_name: aiide-db
    image: postgres:16
    env_file: [.env]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiide}
      POSTGRES_USER: ${POSTGRES_USER:-aiide}
      POSTGRES_DB: ${POSTGRES_DB:-aiide}
    ports: ["${POSTGRES_PORT:-5542}:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]

  redis:
    container_name: aiide-redis
    image: redis:7
    ports: ["${REDIS_PORT:-6479}:6379"]

  minio:
    container_name: aiide-minio
    image: minio/minio
    command: server /data --console-address ":9001"
    env_file: [.env]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aiide}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aiide123}
    ports: ["${MINIO_API_PORT:-9100}:9000","${MINIO_CONSOLE_PORT:-9101}:9001"]
    volumes: [miniodata:/data]

  ollama:
    container_name: aiide-ollama
    image: ollama/ollama
    ports: ["${OLLAMA_PORT:-12555}:11434"]
    volumes: [ollamadata:/root/.ollama]

  prometheus:
    container_name: aiide-prometheus
    image: prom/prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["${PROMETHEUS_PORT:-9095}:9090"]

  grafana:
    container_name: aiide-grafana
    image: grafana/grafana
    ports: ["${GRAFANA_PORT:-3040}:3000"]
    depends_on: [prometheus]
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards

volumes:
  dbdata:
  miniodata:
  ollamadata:
